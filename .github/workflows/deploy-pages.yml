name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/kjv-study-tool-3971
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build KJV Study
        run: npm run build

      - name: Build Ledger
        working-directory: ledger
        env:
          GITHUB_PAGES: '1'
        run: |
          npm ci
          npm run build

      - name: Build Fundamentals
        working-directory: fundamentals
        env:
          GITHUB_PAGES: '1'
          VITE_API_URL: ${{ vars.FUNDAMENTALS_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish Ledger next to KJV Study
        run: |
          mkdir -p dist/ledger
          cp -r ledger/dist/. dist/ledger/

      - name: Publish Fundamentals next to KJV Study
        run: |
          mkdir -p dist/fundamentals
          cp -r fundamentals/dist/. dist/fundamentals/

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
